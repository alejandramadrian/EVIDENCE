<!DOCTYPE html>
<html lang="es">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<head>
  <title>EVIDENCE - Selección de Personaje</title>
  <link rel="stylesheet" href="../css/output.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950">
<header>
  </header>
<main class="bg-[url('../img/seleccion.png')] h-screen bg-cover py-20 md:py-14 lg:py-16 xl:py-10">
  <div class="flex flex-wrap md:flex-nowrap justify-center md:justify-between pr-20"><a href="../index.html"><img class= "md:w-6/12 lg:w-3/12 px-10" src="../img/logo-evidence.png" alt="logo evidence"></a><button id="btnInicio" class="border-2 border-amber-500 rounded-lg px-2 md:px-8 h-8 md:h-12 shadow-amber-500 bg-orange-950 uppercase font-medium text-2xs md:text-lg tracking-wider text-center text-white hover:bg-amber-500 hover:text-orange-950">Inicio</button>
  </div>
  <h1 class="relative z-10 text-amber-500 font-[abhaya] text-shadow-xl uppercase text-base md:text-lg lg:text-xl xl:text-3xl tracking-wider text-wrap underline px-14 lg:px-20 py-10 md:py-3">Selección de Personaje</h1>
  <div class="grid md:grid-cols-2 justify-evenly px-16">
    <div class="grid grid-rows-5 grid-rows-[10px] gap-y-px justify-center">
    <img class="px-14 row-span-3 lg:px-20 lg:py-2 lg:max-w-md" src="../img/ivan.jpeg" alt="Presentación de personaje Ivan Delacroix">
    <p class="row-span-1 text-amber-500 font-[abhaya] text-shadow-xl text-xl tracking-wider text-wrap text-center">El culpable arrepentido</p>
    <div class="row-span-1 flex justify-center pt-10 pb-16">
    <button id="btnIvan" class="border-2 border-amber-500 rounded-lg px-6 py-1 shadow-amber-500 bg-orange-950 uppercase font-medium text-lg tracking-wider text-center text-white hover:bg-amber-500 hover:text-orange-950">Ivan</button></div>
    </div>
    <div class="grid grid-rows-5 grid-rows-[10px] gap-y-px justify-center">
    <img class="px-14 row-span-3 lg:px-20 lg:py-2 lg:max-w-md" src="../img/vera.jpeg" alt="Presentación de personaje Vera Baumont">
    <p class="row-span-1 text-amber-500 font-[abhaya] text-shadow-xl text-xl tracking-wider text-wrap text-center">La sombra que vuelve</p>
    <div class="row-span-1 flex justify-center pt-10 pb-16">
    <button id="btnVera" class="border-2 border-amber-500 rounded-lg px-6 py-1 shadow-amber-500 bg-orange-950 uppercase font-medium text-lg tracking-wider text-center text-white hover:bg-amber-500 hover:text-orange-950">Vera</button></div>
    </div>
  </div>
    <footer class="border-t border-t-gray-300 py-8 lg:py-5">
      <p class="text-amber-500 text-center text-xs lg:text-base">2025 - Artes Multimediales I - UNA</p>
    </footer>
</main>
<script src="../js/script.js"></script>
</body>
</html>
